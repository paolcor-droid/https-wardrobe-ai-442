name: StyleScan v2 tests
on:
  pull_request:
    branches: [main]
  push:
    branches: [stylescan-v2-merge]
jobs:
  backend-unit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: pytest tests/test_palette_engine.py tests/test_recommendation_engine.py -q
