name: LUMIERE development checks

# Validation only: never deploy or grant write access to repository contents.
permissions:
  contents: read

on:
  push:
    branches: [lumiere-recommendations-v2]
  pull_request:
    branches: [lumiere-recommendations-v2]

jobs:
  backend-unit:
    timeout-minutes: 20
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install focused test dependencies
        run: python -m pip install pytest pytest-asyncio pytest-xdist pydantic requests Pillow fastapi==0.110.1 httpx==0.27.2 python-multipart boto3
      - name: Compile Python
        run: python -m compileall -q server.py services scripts tests
      - name: Run independent planner and catalogue tests
        run: python -m pytest -q tests/test_wardrobe_planner.py tests/test_price_snapshots.py tests/test_catalogue_providers.py tests/test_supplier_catalogue_import.py tests/test_supplier_catalogue_store.py tests/test_discover_search.py tests/test_shopify_test_adapter.py tests/test_customer_pricing.py tests/test_department_filter.py tests/test_photo_privacy.py tests/test_security_gate.py tests/test_customer_auth.py tests/test_account_recovery_smtp.py tests/test_distributed_throttle.py tests/test_account_routes.py tests/test_demo_catalogue.py tests/test_staging_preflight.py tests/test_remote_photo_deletion.py tests/test_s3_photos.py tests/test_supabase_photos.py
  frontend-types:
    timeout-minutes: 20
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install --no-audit --no-fund
      - run: npx tsc --noEmit

  mobile-bundles:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install --no-audit --no-fund
      - name: Export Android Metro bundle
        run: npx expo export --platform android --output-dir /tmp/lumiere-android-export
      - name: Export iOS Metro bundle
        run: npx expo export --platform ios --output-dir /tmp/lumiere-ios-export

  pose-inference:
    timeout-minutes: 20
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install compatible MediaPipe Tasks dependencies
        run: python -m pip install -r requirements-pose.txt Pillow requests
      - name: Download local pose model
        run: python scripts/install_pose_model.py
      - name: Verify real native pose inference with synthetic image
        env:
          PYTHONPATH: .
        run: python scripts/smoke_pose_detection.py
      - name: Run photo suitability unit tests
        run: python -m pip install pytest && python -m pytest -q tests/test_tryon_preflight.py
