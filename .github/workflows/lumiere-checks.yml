name: LUMIERE development checks

on:
  push:
    branches: [lumiere-recommendations-v2]
  pull_request:
    branches: [lumiere-recommendations-v2]

jobs:
  backend-unit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install focused test dependencies
        run: python -m pip install pytest pytest-xdist pydantic requests Pillow fastapi==0.110.1 httpx==0.27.2 python-multipart
      - name: Compile Python
        run: python -m compileall -q server.py services scripts tests
      - name: Run independent planner and catalogue tests
        run: python -m pytest -q tests/test_wardrobe_planner.py tests/test_price_snapshots.py tests/test_catalogue_providers.py tests/test_customer_pricing.py tests/test_department_filter.py tests/test_photo_privacy.py tests/test_security_gate.py tests/test_customer_auth.py tests/test_account_routes.py tests/test_remote_photo_deletion.py
  frontend-types:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install --no-audit --no-fund
      - run: npx tsc --noEmit
